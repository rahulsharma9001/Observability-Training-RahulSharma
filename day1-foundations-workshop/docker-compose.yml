services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: day1-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    image: grafana/loki:3.4.2
    container_name: day1-loki
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro

  tempo:
    image: grafana/tempo:2.5.0
    container_name: day1-tempo
    command:
      - "-config.file=/etc/tempo/tempo.yml"
    ports:
      - "3200:3200"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: day1-otel-collector
    command:
      - "--config=/etc/otelcol-contrib/otel-collector-config.yml"
    depends_on:
      - tempo
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/otel-collector-config.yml:ro

  promtail:
    image: grafana/promtail:3.4.2
    container_name: day1-promtail
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
    depends_on:
      - loki
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./logs:/var/log/app:ro

  grafana:
    image: grafana/grafana:11.6.0
    container_name: day1-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  grafana-data:
  tempo-data:
