server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: day1-json-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: day1-foundations-workshop
          __path__: /var/log/app/app.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger_name: logger_name
            correlationId: correlationId
            itemId: itemId
            traceId: traceId
            spanId: spanId
      - labels:
          level:
          logger_name:
          correlationId:
          itemId:
